name: record-daily
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: record-daily
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Coinalyze daily history
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python3 collectors/coinalyze_daily.py
      - name: CoinGecko daily market cap
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python3 collectors/coingecko_daily.py
        continue-on-error: true
      - name: Binance Vision archive (new daily metrics files, incl. top-trader ratio; skips files already held)
        run: python3 collectors/binance_vision_backfill.py BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,LTCUSDT,DOTUSDT,LINKUSDT,AAVEUSDT,AVAXUSDT,BCHUSDT,HBARUSDT,1000SHIBUSDT,XLMUSDT,XTZUSDT,ZECUSDT,NEARUSDT,ALGOUSDT,WLDUSDT,RENDERUSDT
        continue-on-error: true
      - name: joined daily grid
        run: python3 collectors/daily_grid.py
      - name: commit
        run: |
          git config user.name "database-recorder"
          git config user.email "recorder@users.noreply.github.com"
          git add raw/coinalyze_daily raw/marketcap raw/binance_vision derived/daily_grid.csv
          if git diff --cached --quiet; then
            echo "no new rows"
            exit 0
          fi
          git commit -m "record-daily: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git fetch origin main
          if ! git rebase origin/main; then
            git diff --name-only --diff-filter=U | while read -r f; do
              git show :2:"$f" > /tmp/ours.csv || true
              git show :3:"$f" > /tmp/theirs.csv || true
              python3 - "$f" << 'PY'
          import sys
          path = sys.argv[1]
          rows = []
          seen = set()
          for name in ("/tmp/ours.csv", "/tmp/theirs.csv"):
              try:
                  lines = open(name).read().splitlines()
              except FileNotFoundError:
                  continue
              for i, line in enumerate(lines):
                  if i == 0 and not rows:
                      rows.append(line)
                      continue
                  if line and line not in seen:
                      seen.add(line)
                      rows.append(line)
          open(path, "w").write("\n".join(rows) + "\n")
          PY
              git add "$f"
            done
            GIT_EDITOR=true git rebase --continue
          fi
          git push origin HEAD:main
