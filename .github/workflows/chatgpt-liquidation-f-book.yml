name: ChatGPT Liquidation F Book Admission

on:
  push:
    branches: [chatgpt-liquidation-f-book]
    paths:
      - 'research/liquidations/code/book_admission.py'
      - '.github/workflows/chatgpt-liquidation-f-book.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install numpy pandas scipy
      - name: Prepare panel path
        run: sudo mkdir -p /home/claude && sudo chown "$USER":"$USER" /home/claude
      - name: Build 4h research panel
        working-directory: research/crowding-2026-10-01
        run: python build.py
      - name: Run admission test
        run: python research/liquidations/code/book_admission.py
      - name: Commit admission results
        run: |
          git config user.name 'chatgpt-research'
          git config user.email 'noreply@openai.com'
          git add research/liquidations/results/book_admission*.csv
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'research: liquidation-F combined-book admission results'
            git push
          fi
