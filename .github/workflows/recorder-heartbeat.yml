name: recorder-heartbeat
on:
  workflow_dispatch:
  schedule:
    - cron: "11 */3 * * *"
permissions:
  actions: write
  contents: read
concurrency:
  group: heartbeat
  cancel-in-progress: false
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: dispatch record-daily if the last success is older than 20 hours
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          last=$(gh run list --repo "$REPO" --workflow record-daily.yml --status success --limit 1 --json updatedAt --jq '.[0].updatedAt // empty')
          age=999999
          if [ -n "$last" ]; then age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 3600 )); fi
          echo "last daily success: ${last:-none} age_hours=$age"
          if [ "$age" -ge 20 ]; then
            gh workflow run record-daily.yml --repo "$REPO" --ref main && echo "dispatched record-daily" || echo "daily dispatch failed"
          else
            echo "daily is fresh"
          fi
      - name: dispatch record-hourly now and at :18 every hour
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          end=$(( $(date +%s) + 340*60 ))
          while true; do
            gh workflow run record-hourly.yml --repo "$REPO" --ref main && echo "dispatched $(date -u +%FT%TZ)" || echo "dispatch failed"
            now=$(date +%s); next=$(( (now/3600)*3600 + 18*60 )); [ "$next" -le "$now" ] && next=$((next+3600))
            [ "$next" -ge "$end" ] && break
            sleep $((next-now))
          done
      - name: hand off to the next heartbeat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run recorder-heartbeat.yml --repo "$REPO" --ref main
