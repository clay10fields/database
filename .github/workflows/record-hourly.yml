name: record-hourly
on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 UTC, after the hour has closed on Coinalyze
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: record
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas
      - name: record 1h tables (append-only)
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python3 collectors/coinalyze_hourly.py --out raw/coinalyze_1h
        continue-on-error: true
      - name: rebuild derived panels (1h 4h 8h 12h 1d)
        run: python3 collectors/resample.py
      - name: commit
        run: |
          git config user.name "database-recorder"
          git config user.email "recorder@users.noreply.github.com"
          git add raw/coinalyze_1h derived
          git diff --cached --quiet || git commit -qm "record: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase && git push -q
