name: record-hourly
on:
  schedule:
    # GitHub delivers scheduled events to this account very sparsely — across all three cron
    # workflows only one scheduled run has ever fired. GitHub's hosted scheduler is best-effort and
    # drops runs under load; it cannot be forced. So fire four times an hour at offset minutes (away
    # from the congested top of the hour) to raise the odds that at least one lands each hour. This is
    # safe and cheap: the collectors dedup against existing rows and each run pulls 48h of history, so
    # extra runs append nothing new and a single landed run backfills whatever earlier slots missed.
    # Billable minutes measured at 0, so the extra frequency costs nothing.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: record
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas cryptography
      - name: record Coinalyze 1h
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python3 collectors/coinalyze_hourly.py --out raw/coinalyze_1h
        continue-on-error: true
      - name: record Kraken futures
        run: python3 collectors/kraken_hourly.py --out raw/kraken_1h
        continue-on-error: true
      - name: record Coinbase spot
        run: python3 collectors/coinbase_hourly.py --out raw/coinbase_1h
        continue-on-error: true
      - name: record Binance US spot
        run: python3 collectors/binance_us_hourly.py --out raw/binance_us_1h
        continue-on-error: true
      - name: record Kalshi perps
        run: python3 collectors/kalshi_hourly.py --out raw/kalshi_1h
        continue-on-error: true
      - name: rebuild derived panels (1h 4h 8h 12h 1d)
        run: python3 collectors/resample.py
      - name: paper signal watcher (no orders)
        run: python3 collectors/signals.py
        continue-on-error: true
      - name: paper books — four admission policies on one signal stream (no orders)
        run: python3 collectors/paper_books.py
        continue-on-error: true
      - name: commit
        run: |
          git config user.name "database-recorder"
          git config user.email "recorder@users.noreply.github.com"
          git add raw/coinalyze_1h raw/kraken_1h raw/coinbase_1h raw/binance_us_1h raw/kalshi_1h derived
          git diff --cached --quiet || git commit -qm "record: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase && git push -q
