name: ChatGPT LIQF Universe Audit

on:
  push:
    branches: [chatgpt-liqf-universe-audit]
    paths:
      - 'research/liquidations/code/liqf_universe_audit.py'
      - '.github/workflows/chatgpt-liqf-universe-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Prepare panel path
        run: sudo mkdir -p /home/claude && sudo chown "$USER":"$USER" /home/claude
      - name: Build 4h panel
        working-directory: research/crowding-2026-10-01
        run: python build.py
      - name: Run LIQF universe audit
        run: python research/liquidations/code/liqf_universe_audit.py
      - name: Commit results
        run: |
          git config user.name 'chatgpt-research'
          git config user.email 'noreply@openai.com'
          git add research/liquidations/results/liqf_universe_*.csv
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'research: LIQF causal-universe audit results'
            git push
          fi
