name: ChatGPT Step 22 Current Book Refresh

on:
  push:
    branches: [chatgpt-liqf-readmission-corrected-book]
    paths:
      - 'research/diversification/code/diversification_current_book.py'
      - '.github/workflows/chatgpt-step22-current-book.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diversify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Prepare panel path
        run: sudo mkdir -p /home/claude && sudo chown "$USER":"$USER" /home/claude
      - name: Build 4h panel
        working-directory: research/crowding-2026-10-01
        run: python build.py
      - name: Run corrected-book Step 22
        run: python research/diversification/code/diversification_current_book.py
      - name: Commit results
        run: |
          git config user.name 'chatgpt-research'
          git config user.email 'noreply@openai.com'
          git add research/diversification/results/current_book_*.csv
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'research: refresh Step 22 on corrected book'
            git push
          fi
