name: ChatGPT Step 25 Liquidation Safety

on:
  push:
    branches: [chatgpt-step25-liquidation-safety]
    paths:
      - 'research/liquidation-safety/code/**'
      - '.github/workflows/chatgpt-step25-liquidation-safety.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  step25:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install numpy pandas scipy
      - name: Prepare panel path
        run: sudo mkdir -p /home/claude && sudo chown "$USER":"$USER" /home/claude
      - name: Build 4h research panel
        working-directory: research/crowding-2026-10-01
        run: python build.py
      - name: Run Step 25
        run: python research/liquidation-safety/code/liquidation_safety.py
      - name: Commit Step 25 results
        run: |
          git config user.name 'chatgpt-research'
          git config user.email 'noreply@openai.com'
          git add research/liquidation-safety/results
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'research: step 25 liquidation safety results'
            git push
          fi
