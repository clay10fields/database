name: record-coingecko
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: record-coingecko
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: CoinGecko daily market cap
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python3 collectors/coingecko_daily.py
      - name: commit
        run: |
          git config user.name "database-recorder"
          git config user.email "recorder@users.noreply.github.com"
          git add raw/marketcap
          if git diff --cached --quiet; then
            echo "no new rows"
            exit 0
          fi
          git commit -m "coingecko: $(date -u +%Y-%m-%d)"
          git fetch origin main
          if ! git rebase origin/main; then
            git diff --name-only --diff-filter=U | while read -r f; do
              git show :2:"$f" > /tmp/ours.csv || true
              git show :3:"$f" > /tmp/theirs.csv || true
              python3 - "$f" << 'PY'
          import sys
          path = sys.argv[1]
          rows = []
          seen = set()
          for name in ("/tmp/ours.csv", "/tmp/theirs.csv"):
              try:
                  lines = open(name).read().splitlines()
              except FileNotFoundError:
                  continue
              for i, line in enumerate(lines):
                  if i == 0 and not rows:
                      rows.append(line)
                      continue
                  if line and line not in seen:
                      seen.add(line)
                      rows.append(line)
          open(path, "w").write("\n".join(rows) + "\n")
          PY
              git add "$f"
            done
            GIT_EDITOR=true git rebase --continue
          fi
          git push origin HEAD:main
